spring:
  application:
    name: cognia-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
diagnostic:
  mastery:
    difficulty-weights:
      1: 1.0
      2: 1.5
      3: 2.0
learning-path:
  initial-mastery-threshold: 0.80 # provisional; validate with a teacher
  short-evaluation:
    approval-threshold: 70 # provisional; validate with a teacher
    consecutive-failures-before-recalculation: 2 # provisional; validate with a teacher
review:
  initial-delay-days: 1 # provisional; validate with a teacher
  queue-limit: 20 # provisional; validate with a teacher
  consecutive-lapses-before-recalculation: 2 # provisional; validate with a teacher
global-exam:
  max-per-concept: 2 # provisional; validate with a teacher
  passing-threshold: 70 # provisional; validate with a teacher
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
review:
  initial-delay-days: 0 # development only, to exercise the queue immediately
---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
