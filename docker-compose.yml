services:
  postgres:
    image: postgres:16
    container_name: cognia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cognia}
      POSTGRES_USER: ${POSTGRES_USER:-cognia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cognia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognia} -d ${POSTGRES_DB:-cognia}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  cognia-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognia-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cognia}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cognia}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      COGNIA_JWT_SECRET: ${COGNIA_JWT_SECRET:?Define COGNIA_JWT_SECRET in .env}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cognia-postgres-data:
